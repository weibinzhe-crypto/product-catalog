<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品价目表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf8f6;color:#333;font-size:15px}
header{background:#fff;padding:14px 16px;text-align:center;border-bottom:1px solid #f0e6df;position:sticky;top:0;z-index:10}
header h1{font-size:18px;font-weight:600;color:#8b6914;margin-bottom:10px;letter-spacing:2px}
header input{width:100%;padding:10px 16px;border:1px solid #e8ddd4;border-radius:24px;font-size:14px;background:#fff;outline:none}
header input:focus{border-color:#c9a86c}
.main{display:flex;height:calc(100vh - 110px)}
.sidebar{width:68px;background:#fff;border-right:1px solid #f0e6df;display:flex;flex-direction:column;padding:12px 0;flex-shrink:0}
.sidebar-btn{padding:16px 0;border:none;background:transparent;font-size:13px;color:#888;cursor:pointer;border-left:3px solid transparent;text-align:center}
.sidebar-btn:hover{color:#8b6914;background:#fdf6f0}
.sidebar-btn.active{color:#fff;border-left-color:#8b6914;background:linear-gradient(90deg,#c9a86c,#a67c52);font-weight:600;border-radius:0 8px 8px 0}
#productGrid{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.product-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(139,105,20,0.06);display:flex;align-items:center;gap:12px;border:1px solid #f5efe8}
.product-info{flex:1;min-width:0}
.product-name{font-size:15px;font-weight:600;color:#2c2c2c;margin-bottom:6px;line-height:1.3}
.product-row{font-size:13px;margin-bottom:3px;color:#666}
.product-price{color:#c9a86c;font-weight:700;font-size:14px}
.product-bottom{font-size:12px;color:#999;margin-top:4px}
.product-bottom span{display:block;margin-bottom:2px}
.product-bottom span:last-child{padding-top:6px;border-top:1px dashed #f0e6df}
.product-img{width:110px;height:110px;object-fit:contain;background:#fdf6f0;border-radius:8px;flex-shrink:0;border:1px solid #f0e6df}
#noData{display:none;text-align:center;padding:30px;color:#999}
</style>
</head>
<body>
<header>
<h1>产品价目表</h1>
<input type="text" id="searchInput" placeholder="搜索产品名称或条码...">
</header>
<div class="main">
<div class="sidebar" id="sidebar"></div>
<div id="productGrid"></div>
</div>
<div id="noData">未找到匹配的产品</div>
<script>
var P=[],B='益肤';
fetch('/data/products.json').then(function(r){return r.json()}).then(function(d){
P=d;
var o=['益肤','美卿','绽妍','芙清','敷尔佳','可复美','润百颜','创福康','诗漾'];
var bs=o.filter(function(b){return P.some(function(p){return p.brand===b})});
var ob=[...new Set(P.map(function(p){return p.brand}).filter(function(b){return b&&o.indexOf(b)<0}))].sort();
bs=bs.concat(ob);
document.getElementById('sidebar').innerHTML=bs.map(function(b,i){
return '<button class="sidebar-btn'+(i===0?' active':'')+'" onclick="S(this,\''+b+'\')">'+b+'</button>'
}).join('')+'<button class="sidebar-btn" onclick="S(this,\'all\')">全部</button>';
R();
});
document.getElementById('searchInput').oninput=R;
function S(el,b){B=b;document.querySelectorAll('.sidebar-btn').forEach(function(btn){btn.classList.remove('active')});el.classList.add('active');R()}
function R(){
var kw=document.getElementById('searchInput').value.toLowerCase();
var g=P.filter(function(p){
var m=B==='all'||p.brand===B;
if(kw)m=m&&(p.name.toLowerCase().indexOf(kw)>=0||p.brand.toLowerCase().indexOf(kw)>=0||(p.barcode&&p.barcode.indexOf(kw)>=0));
return m});
document.getElementById('noData').style.display=g.length?'none':'block';
document.getElementById('productGrid').scrollTop=0;
document.getElementById('productGrid').innerHTML=g.map(function(p){
var img=p.image?'<img src="'+p.image+'" class="product-img" loading="lazy" onerror="this.style.display=\'none\'">':'';
return '<div class="product-card"><div class="product-info"><div class="product-name">'+p.name+'</div><div class="product-row">规格 '+p.spec+'</div><div class="product-row">价格 <span class="product-price">¥'+p.price+'</span></div><div class="product-bottom"><span>条码 '+(p.barcode||'')+'</span><span>箱规 '+p.boxSpec+'</span></div></div>'+img+'</div>'
}).join('')}
</script>
</body>
</html>
